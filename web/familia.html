<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente · Familias</title>
<meta name="theme-color" content="#2f4a3e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="estilo.css">
<style>
  .semana { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; }
  .dia { flex:0 0 78px; text-align:center; padding:8px 4px 6px; border-radius:10px; background:#fff; cursor:pointer; border:1.5px solid var(--borde); }
  .dia.on { border-color:var(--pizarron); box-shadow:0 3px 0 var(--pizarron); }
  .dia img { width:44px; height:44px; } .dia .d { font-size:13px; color:var(--gris); text-transform:capitalize; }
  .tira { grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); }
  .obj { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--borde); }
  .obj:last-child { border-bottom:0; }
  .chat { display:flex; flex-direction:column; gap:8px; max-height:440px; overflow-y:auto; margin:8px 0 10px; }
  .m { padding:10px 12px; border-radius:12px; max-width:86%; line-height:1.45; white-space:pre-wrap; }
  .m.familia { align-self:flex-end; background:var(--pizarron); color:var(--tiza); border-bottom-right-radius:3px; }
  .m.puente { align-self:flex-start; background:#fdf6e1; border:1px solid #efe2b8; border-bottom-left-radius:3px; }
  .m.puente.aviso { background:#f3f1ec; border-color:#ddd8cc; color:#555; font-style:italic; }
  .sug { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .sug button { border:1.5px solid var(--tinta); color:var(--tinta); background:#fff; border-radius:20px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; }
  form { display:flex; gap:8px; } form .big { width:auto; margin:0; padding:0 18px; }
  .pagina { padding-top:22px; border-radius:14px; margin-top:14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chips button { border:1.5px solid var(--tinta); background:#fff; color:var(--tinta); border-radius:20px; padding:6px 14px; font:inherit; font-weight:700; cursor:pointer; }
  .chips button.on { background:var(--pizarron); color:var(--tiza); border-color:var(--pizarron); }
  .ficha dt { font-weight:700; margin-top:8px; } .ficha dd { margin:2px 0 0; white-space:pre-wrap; }
  .doc { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed var(--borde); flex-wrap:wrap; }
  .doc:last-child { border-bottom:0; } .doc .big { width:auto; margin:0; padding:0 14px; }
  .barra { display:flex; justify-content:flex-end; gap:12px; font-size:14px; margin-bottom:6px; } .barra a { color:var(--tinta); }
</style>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header><h1 id="tit">Puente</h1><div class="bajada" id="sub">de la escuela a casa, en pictogramas</div><span class="tiza"></span></header>
<main id="contenido" tabindex="-1"><div class="pagina" id="app"><p class="vacio">Cargando…</p></div></main>
<footer><span id="pie">Este espacio es privado: solo lo ve quien tiene el link.</span><div id="puente-pie" data-feedback="si" data-donaciones="no"></div></footer>
<script src="pie.js" defer></script>
<script src="cuenta.js"></script>
<script>
const PICTOS = {};
async function buscarPicto(k) {
  k = (k || "").toLowerCase();
  if (!(k in PICTOS)) PICTOS[k] = fetch("https://api.arasaac.org/api/pictograms/es/search/" + encodeURIComponent(k)).then(r => r.ok ? r.json() : []).then(j => j[0] ? `https://static.arasaac.org/pictograms/${j[0]._id}/${j[0]._id}_300.png` : null).catch(() => null);
  return PICTOS[k];
}
function completarPictos() {
  document.querySelectorAll("img[data-k]:not([src])").forEach(async im => { const u = await buscarPicto(im.dataset.k); if (u) im.src = u; else im.replaceWith(Object.assign(document.createElement("div"), { className: "vacio", textContent: "?" })); });
}
new MutationObserver(completarPictos).observe(document.documentElement, { childList: true, subtree: true });

const $ = id => document.getElementById(id);
const t = new URLSearchParams(location.search).get("t") || location.hash.slice(1);
const ANIMO = { contento: 35547, tranquilo: 31310, cansado: 35537, angustiado: 35545, irritable: 35539 };
const animoImg = (a, px = 44) => ANIMO[a] ? `<img src="https://static.arasaac.org/pictograms/${ANIMO[a]}/${ANIMO[a]}_300.png" alt="${a}" width="${px}" height="${px}">` : "";
const PLANO = { "logrado o casi logrado": ["avanzando", "Casi logrado"], "avanzando": ["avanzando", "Avanzando"], "estable": ["estable", "Sostenido"], "estancado": ["estancado", "Lo seguimos trabajando"], "en retroceso": ["estancado", "Necesita más apoyo"], "sin datos suficientes": ["", "Todavía sin datos"] };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fechaLinda = f => new Date(f + "T12:00:00").toLocaleDateString("es-AR", { weekday:"long", day:"numeric", month:"long" });
function hablar(x) { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(x); u.lang = "es-AR"; speechSynthesis.speak(u); } }
let D = null;
const FX = () => (D && D.funciones) || {};

let MODO = "token", ALUMNO_ID = null, FICHA = null, ESFAMILIA = false, MIS = [], VERSION_PRIV = null, DOCS = [];
async function cargar() {
  if (t) return cargarToken();
  const e = await Puente.estado().catch(() => null);
  if (!e || e.modo === "demo") return $("app").innerHTML = `<div class="card">Este link no es válido. Pedile a la docente el link de tu hijo o hija.</div>`;
  if (!e.sesion) return location.href = "login.html?familia";
  MODO = "sesion"; ESFAMILIA = e.sesion.tipo === "familia";
  $("pie").textContent = ESFAMILIA ? "Este espacio es privado: solo lo ven las familias que la escuela vinculó." : "Vista previa de la docente: así lo ve la familia.";
  const pedido = Number(new URLSearchParams(location.search).get("alumno")) || null;
  try {
    if (ESFAMILIA) { const r = await Puente.api("api/fichas"); MIS = r.alumnos; VERSION_PRIV = r.privacidad || null; }
    else if (pedido) MIS = [(await Puente.api("api/fichas?id=" + pedido)).alumno];
  } catch (err) { return $("app").innerHTML = `<div class="card">${esc(err.message)}</div>`; }
  if (!MIS.length) return $("app").innerHTML = `<div class="card">${ESFAMILIA ? "Tu email todavía no está vinculado a ningún alumno. Pedile a la docente que lo agregue en la ficha." : "Elegí un alumno desde el panel docente."}</div><div class="barra"><a href="#" onclick="Puente.salir();return false">Salir</a></div>`;
  await abrirAlumno((MIS.find(a => a.id === pedido) || MIS[0]).id);
}
async function abrirAlumno(id) {
  ALUMNO_ID = id; FICHA = MIS.find(a => a.id === id);
  const r = await fetch("api/familia?alumno=" + id, { credentials: "same-origin" });
  if (r.status === 401) return location.href = "login.html?familia";
  if (!r.ok) return $("app").innerHTML = `<div class="card">No pudimos cargar el espacio. Probá de nuevo en un rato.</div>`;
  D = await r.json();
  // Informes y documentos que la escuela compartió. En la vista previa de la docente llegan todos: se muestran solo los visibles.
  try { DOCS = ((await Puente.api("api/fichas?documentos=" + id)).documentos || []).filter(d => d.visible_familia !== false); } catch { DOCS = []; }
  $("tit").textContent = `El cuaderno de ${D.alumno}`;
  $("sub").textContent = D.actualizado ? "Puente · actualizado el " + new Date(D.actualizado).toLocaleString("es-AR", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" }) : "Puente · de la escuela a casa";
  pintar();
}
async function cargarToken() {
  const r = await fetch("api/familia?t=" + encodeURIComponent(t));
  if (r.status === 410) return location.href = "login.html?familia";
  if (!r.ok) return $("app").innerHTML = `<div class="card">${r.status === 404 ? "No encontramos este espacio." : "No pudimos cargar el espacio."} Pedile el link a la docente.</div>`;
  D = await r.json();
  $("tit").textContent = `El cuaderno de ${D.alumno}`;
  $("sub").textContent = "Puente · actualizado el " + new Date(D.actualizado).toLocaleString("es-AR", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
  pintar();
}

// Ficha de familia (solo con cuentas): lectura, consentimiento y su propio teléfono.
const APOYO_TXT = { comunicacion: "Comunicación", sensoriales: "Sensoriales (qué le molesta)", regulacion: "Qué lo calma", alimentacion: "Alimentación", intereses: "Qué le gusta", otros: "Otros apoyos" };
function htmlFicha() {
  if (!FICHA) return "";
  const c = FICHA.consentimiento || {};
  const apoyos = Object.entries(APOYO_TXT).filter(([k]) => FICHA.apoyos && FICHA.apoyos[k]).map(([k, txt]) => `<dt>${txt}</dt><dd>${esc(FICHA.apoyos[k])}</dd>`).join("");
  return `<div class="card ficha"><details${c.dado ? "" : " open"}><summary><span class="rotulo" style="display:inline">La ficha de ${esc(FICHA.nombre)}</span></summary>
    <p class="muted">La completa la escuela. Si algo no está bien, avisale a la docente.</p>
    <dl>
      <dt>Contactos</dt><dd>${FICHA.contactos.map(x => `${esc(x.nombre)}${x.vinculo ? " (" + esc(x.vinculo) + ")" : ""}${x.telefono ? " · " + esc(x.telefono) : ""}${x.email ? " · " + esc(x.email) : ""}`).join("<br>") || "—"}</dd>
      ${apoyos}
      ${FICHA.objetivos ? `<dt>Objetivos del PPI</dt><dd>${FICHA.objetivos.length ? FICHA.objetivos.map(o => "• " + esc(o)).join("<br>") : "—"}</dd>` : ""}
    </dl>
    ${ESFAMILIA && FICHA.contactos.some(x => x.email) ? `<form id="fTel" class="fila" style="margin-top:10px"><input id="miTel" inputmode="tel" maxlength="30" placeholder="Tu teléfono / WhatsApp"><button class="big chico auto">Actualizar mi teléfono</button></form>` : ""}
    <div class="${c.dado ? "logro" : "alerta"}" style="margin-top:12px">${c.dado ? `Consentimiento dado por ${esc(c.quien)} el ${esc(c.fecha)}.` : "Todavía no está el consentimiento de la familia para usar Puente."}</div>
    ${ESFAMILIA ? (c.dado ? `<button class="big alt chico" id="btnCons" data-dar="0">Retirar el consentimiento</button>`
      : `<p class="muted">Al dar tu consentimiento aceptás que la escuela registre en Puente cómo fue el día de ${esc(FICHA.nombre)} (solo su nombre de pila, sin fotos ni diagnósticos) y que lo puedan ver las familias vinculadas, según la <a href="privacidad.html" target="_blank">política de privacidad</a> (versión ${esc(VERSION_PRIV || "vigente")}). Los datos se guardan en servidores fuera de Argentina y una IA ayuda a ordenar los registros.</p><button class="big" id="btnCons" data-dar="1">Doy mi consentimiento</button>`) : ""}
    ${c.dado && c.version ? `<p class="muted">Aceptaste la <a href="privacidad.html" target="_blank">política de privacidad</a> versión ${esc(c.version)}.</p>` : ""}
    ${ESFAMILIA ? `<div class="card" style="margin-top:12px"><span class="rotulo">Tus datos</span>
      <p class="muted">Podés descargar todo lo que Puente guarda de tu familia, o pedir la baja: se borra tu contacto, tu historial de preguntas y, si no tenés otro alumno en Puente, tu cuenta. Los registros de la escuela sobre ${esc(FICHA.nombre)} los maneja la escuela.</p>
      <div class="fila"><button class="big alt chico" id="btnExport" type="button">Descargar mis datos</button><button class="big alt chico peligro" id="btnBaja" type="button">Pedir la baja y borrar mis datos</button></div></div>` : ""}
    <p class="muted" id="msgFicha"></p></details></div>`;
}
function conectarFicha() {
  const b = $("btnCons");
  if (b) b.onclick = async () => {
    if (b.dataset.dar === "0" && !confirm("¿Seguro que querés retirar el consentimiento?")) return;
    try { const r = await Puente.api("api/fichas", { method: "POST", body: { accion: "consentir", id: ALUMNO_ID, dado: b.dataset.dar === "1" } }); actualizarFicha(r.alumno); }
    catch (e) { $("msgFicha").textContent = e.message; }
  };
  const ex = $("btnExport");
  if (ex) ex.onclick = async () => {
    try {
      const r = await Puente.api("api/fichas?exportar=1");
      const url = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: "application/json" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: "puente-mis-datos.json" }); a.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { $("msgFicha").textContent = e.message; }
  };
  const bj = $("btnBaja");
  if (bj) bj.onclick = async () => {
    if (!confirm("¿Seguro que querés darte de baja de Puente? Se borran tus datos y vas a dejar de ver el día en la escuela. No se puede deshacer.")) return;
    try { await Puente.api("api/fichas", { method: "POST", body: { accion: "baja", confirmar: true } }); alert("Listo: te diste de baja y borramos tus datos."); location.href = "login.html?familia"; }
    catch (e) { $("msgFicha").textContent = e.message; }
  };
  const f = $("fTel");
  if (f) f.onsubmit = async ev => {
    ev.preventDefault();
    try { const r = await Puente.api("api/fichas", { method: "POST", body: { accion: "mi_contacto", id: ALUMNO_ID, telefono: $("miTel").value } }); actualizarFicha(r.alumno); $("msgFicha").textContent = "Teléfono actualizado ✓"; }
    catch (e) { $("msgFicha").textContent = e.message; }
  };
}
function actualizarFicha(a) { Object.assign(FICHA, a); const el = $("ficha"); el.innerHTML = htmlFicha(); el.querySelector("details").open = true; conectarFicha(); }

function pintar() {
  const dias = D.dias || [];
  const logros = dias.flatMap(d => d.logros.map(l => ({ l, f: d.fecha })));
  $("app").innerHTML = `
    ${MODO === "sesion" ? `<div class="barra">${ESFAMILIA ? `<a href="#" id="salir">Salir</a>` : `<a href="docente.html">← Panel docente</a>`}</div>` : ""}
    ${MIS.length > 1 ? `<div class="chips">${MIS.map(a => `<button data-id="${a.id}" class="${a.id === ALUMNO_ID ? "on" : ""}">${esc(a.nombre)}</button>`).join("")}</div>` : ""}
    <div id="ficha">${htmlFicha()}</div>
    <div class="card"><span class="rotulo">Sus últimos días</span>
      ${dias.length ? "" : `<p class="vacio">Todavía no hay días publicados. Apenas la escuela cargue uno, lo vas a ver acá.</p>`}
      <div class="semana" id="semana">${dias.slice().reverse().map((d, i) => `<div class="dia" data-f="${d.fecha}">${animoImg(d.animo)}<div class="d">${esc(d.dia).slice(0,3)} ${d.fecha.slice(8)}</div></div>`).join("")}</div>
      <div id="detalle"></div>
    </div>
    ${MODO === "sesion" && DOCS.length ? `<div class="card"><span class="rotulo">Informes y documentos</span>
      <p class="muted">Los compartió la escuela. Se descargan a tu dispositivo.</p>
      ${DOCS.map(d => `<div class="doc"><span><b>${esc(d.titulo)}</b> <span class="muted">· ${d.tipo === "informe" ? "Informe" : "Documento"} · ${esc(new Date(d.creado).toLocaleDateString("es-AR", { day:"numeric", month:"long", year:"numeric" }))}</span></span>
        <button type="button" class="big alt chico" data-doc="${d.id}">Descargar</button></div>`).join("")}
      <p class="muted" id="msgDocs"></p></div>` : ""}
    ${D.mensaje_docente ? `<div class="card cinta"><span class="rotulo">Mensaje de la escuela</span><p>${esc(D.mensaje_docente)}</p></div>` : ""}
    ${D.agenda ? `<div class="card"><span class="rotulo">Así va a ser su ${esc(D.agenda.dia || "próximo día")}</span><p class="muted">Contáselo la noche anterior mirando los pictos juntos. Los recuadros punteados son apoyos nuevos.</p>
      <div class="tira">${D.agenda.pasos.map(p => `<div class="picto ${p.es_apoyo ? "apoyo" : ""}" data-h="${esc(p.texto || p.palabra_clave)}">${p.picto_url ? `<img src="${p.picto_url}" alt="">` : `<img data-k="${esc(p.palabra_clave)}" alt="">`}<div class="t">${esc(p.palabra_clave)}</div><div class="h">${esc(p.hora || "")}</div></div>`).join("")}</div></div>` : ""}
    ${D.objetivos?.length ? `<div class="card"><span class="rotulo">En qué estamos trabajando</span>${D.objetivos.map(o => { const [c, txt] = PLANO[o.estado] || ["", o.estado]; return `<div class="obj"><div style="flex:1"><b>${esc(o.objetivo)}</b></div><span class="sello ${c}">${txt}</span></div>`; }).join("")}</div>` : ""}
    ${logros.length ? `<div class="card"><span class="rotulo">Logros recientes</span>${logros.slice(0, 6).map(x => `<div class="logro">${esc(x.l)} <span class="muted">· ${esc(fechaLinda(x.f))}</span></div>`).join("")}</div>` : ""}
    ${FX().chat ? `<div class="card"><span class="rotulo">Preguntale a Puente</span>
      <p class="muted">Responde con lo que la escuela registró de ${esc(D.alumno)}. Para temas de salud, hablá con la docente.</p>
      <div class="chat" id="chat"></div>
      <div class="sug" id="sug">${["¿Cómo estuvo esta semana?", "¿Cómo viene comiendo?", "¿Qué día le cuesta más?", "¿Qué puedo hacer en casa?"].map(s => `<button>${s}</button>`).join("")}</div>
      <form id="f"><input id="q" placeholder="Escribí tu pregunta…" autocomplete="off" maxlength="500"><button class="big">Enviar</button></form>
    </div>` : ""}`;
  document.querySelectorAll(".dia").forEach(el => el.onclick = () => verDia(el.dataset.f));
  document.querySelectorAll(".chips button").forEach(b => b.onclick = () => abrirAlumno(Number(b.dataset.id)));
  document.querySelectorAll("button[data-doc]").forEach(b => b.onclick = async () => {
    const d = DOCS.find(x => x.id === Number(b.dataset.doc));
    try { b.disabled = true; await Puente.bajarArchivo("api/fichas?documento=" + d.id, d.nombre_archivo); $("msgDocs").textContent = ""; }
    catch (e) { $("msgDocs").textContent = e.message; } finally { b.disabled = false; }
  });
  if ($("salir")) $("salir").onclick = e => { e.preventDefault(); Puente.salir(); };
  conectarFicha();
  document.querySelectorAll(".picto[data-h]").forEach(el => el.onclick = () => hablar(el.dataset.h));
  document.querySelectorAll("#sug button").forEach(b => b.onclick = () => enviar(b.textContent));
  if ($("f")) $("f").onsubmit = e => { e.preventDefault(); const v = $("q").value.trim(); if (v) { $("q").value = ""; enviar(v); } };
  if (dias[0]) verDia(dias[0].fecha);
  const s = $("semana"); s.scrollLeft = s.scrollWidth;
}

function verDia(f) {
  const d = D.dias.find(x => x.fecha === f); if (!d) return;
  document.querySelectorAll(".dia").forEach(el => el.classList.toggle("on", el.dataset.f === f));
  $("detalle").innerHTML = `<p style="margin:12px 0 4px"><b style="text-transform:capitalize">${esc(fechaLinda(f))}</b> · ${esc(d.animo || "")}</p>
    ${d.resumen ? `<p>${esc(d.resumen)}</p>` : ""}
    ${d.logros.map(l => `<div class="logro">${esc(l)}</div>`).join("")}
    ${d.alertas.map(a => `<div class="alerta">${esc(a)}</div>`).join("")}
    <div class="tira">${d.actividades.map(a => `<div class="picto ${a.estado || ""}" data-h="${esc(a.actividad || a.palabra_clave)}">${a.picto_url ? `<img src="${a.picto_url}" alt="">` : `<img data-k="${esc(a.palabra_clave)}" alt="">`}<div class="t">${esc(a.palabra_clave)}</div><div class="h">${esc(a.hora || "")}</div></div>`).join("")}</div>`;
  $("detalle").querySelectorAll(".picto").forEach(el => el.onclick = () => hablar(el.dataset.h));
}

function burbuja(rol, texto) { const el = document.createElement("div"); el.className = "m " + rol; el.textContent = texto; $("chat").appendChild(el); $("chat").scrollTop = 1e6; return el; }
async function enviar(p) {
  $("sug").style.display = "none";
  burbuja("familia", p);
  const espera = burbuja("puente", "Puente está mirando los registros…");
  try {
    // El historial lo guarda el servidor (con sesión); el navegador solo manda la pregunta.
    const r = await fetch("api/familia", { method:"POST", headers:{ "Content-Type":"application/json" }, credentials:"same-origin", body: JSON.stringify({ accion:"preguntar", ...(MODO === "sesion" ? { alumno_id: ALUMNO_ID } : { token:t }), pregunta:p }) });
    const j = await r.json().catch(() => ({}));
    espera.textContent = j.respuesta || j.error || "No pude responder.";
    // Negativas (fuera de tema) y límites se muestran como aviso suave, no como respuesta.
    if (!r.ok || j.modo === "fuera_de_tema") espera.classList.add("aviso");
  } catch { espera.textContent = "No pude conectarme. Probá de nuevo."; }
}
cargar();
</script>
</body>
</html>
