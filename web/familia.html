<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente · Familias</title>
<meta name="theme-color" content="#2f4a3e">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="estilo.css">
<style>
  .semana { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; }
  .dia { flex:0 0 78px; text-align:center; padding:8px 4px 6px; border-radius:10px; background:#fff; cursor:pointer; border:1.5px solid var(--borde); }
  .dia.on { border-color:var(--pizarron); box-shadow:0 3px 0 var(--pizarron); }
  .dia img { width:44px; height:44px; } .dia .d { font-size:13px; color:var(--gris); text-transform:capitalize; }
  .tira { grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); }
  .obj { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--borde); }
  .obj:last-child { border-bottom:0; }
  .chat { display:flex; flex-direction:column; gap:8px; max-height:440px; overflow-y:auto; margin:8px 0 10px; }
  .m { padding:10px 12px; border-radius:12px; max-width:86%; line-height:1.45; white-space:pre-wrap; }
  .m.familia { align-self:flex-end; background:var(--pizarron); color:var(--tiza); border-bottom-right-radius:3px; }
  .m.puente { align-self:flex-start; background:#fdf6e1; border:1px solid #efe2b8; border-bottom-left-radius:3px; }
  .sug { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .sug button { border:1.5px solid var(--tinta); color:var(--tinta); background:#fff; border-radius:20px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; }
  form { display:flex; gap:8px; } form .big { width:auto; margin:0; padding:0 18px; }
  .pagina { padding-top:22px; border-radius:14px; margin-top:14px; }
</style>
</head>
<body>
<header><h1 id="tit">Puente</h1><div class="bajada" id="sub">de la escuela a casa, en pictogramas</div><span class="tiza"></span></header>
<main><div class="pagina" id="app"><p class="vacio">Cargando…</p></div></main>
<footer>Este espacio es privado: solo lo ve quien tiene el link.<br>Pictogramas: Sergio Palao. Origen: <a href="https://arasaac.org">ARASAAC</a>. Licencia CC BY-NC-SA. Propiedad: Gobierno de Aragón.</footer>
<script>
const PICTOS = {};
async function buscarPicto(k) {
  k = (k || "").toLowerCase();
  if (!(k in PICTOS)) PICTOS[k] = fetch("https://api.arasaac.org/api/pictograms/es/search/" + encodeURIComponent(k)).then(r => r.ok ? r.json() : []).then(j => j[0] ? `https://static.arasaac.org/pictograms/${j[0]._id}/${j[0]._id}_300.png` : null).catch(() => null);
  return PICTOS[k];
}
function completarPictos() {
  document.querySelectorAll("img[data-k]:not([src])").forEach(async im => { const u = await buscarPicto(im.dataset.k); if (u) im.src = u; else im.replaceWith(Object.assign(document.createElement("div"), { className: "vacio", textContent: "?" })); });
}
new MutationObserver(completarPictos).observe(document.documentElement, { childList: true, subtree: true });

const $ = id => document.getElementById(id);
const t = new URLSearchParams(location.search).get("t") || location.hash.slice(1);
const ANIMO = { contento: 35547, tranquilo: 31310, cansado: 35537, angustiado: 35545, irritable: 35539 };
const animoImg = (a, px = 44) => ANIMO[a] ? `<img src="https://static.arasaac.org/pictograms/${ANIMO[a]}/${ANIMO[a]}_300.png" alt="${a}" width="${px}" height="${px}">` : "";
const PLANO = { "logrado o casi logrado": ["avanzando", "Casi logrado"], "avanzando": ["avanzando", "Avanzando"], "estable": ["estable", "Sostenido"], "estancado": ["estancado", "Lo seguimos trabajando"], "en retroceso": ["estancado", "Necesita más apoyo"], "sin datos suficientes": ["", "Todavía sin datos"] };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fechaLinda = f => new Date(f + "T12:00:00").toLocaleDateString("es-AR", { weekday:"long", day:"numeric", month:"long" });
function hablar(x) { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(x); u.lang = "es-AR"; speechSynthesis.speak(u); } }
let D = null, chat = [];

async function cargar() {
  if (!t) return $("app").innerHTML = `<div class="card">Este link no es válido. Pedile a la docente el link de tu hijo o hija.</div>`;
  const r = await fetch("api/familia?t=" + encodeURIComponent(t));
  if (!r.ok) return $("app").innerHTML = `<div class="card">${r.status === 404 ? "No encontramos este espacio." : "No pudimos cargar el espacio."} Pedile el link a la docente.</div>`;
  D = await r.json();
  $("tit").textContent = `El cuaderno de ${D.alumno}`;
  $("sub").textContent = "Puente · actualizado el " + new Date(D.actualizado).toLocaleString("es-AR", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" });
  pintar();
}

function pintar() {
  const dias = D.dias || [];
  const logros = dias.flatMap(d => d.logros.map(l => ({ l, f: d.fecha })));
  $("app").innerHTML = `
    <div class="card"><span class="rotulo">Sus últimos días</span>
      <div class="semana" id="semana">${dias.slice().reverse().map((d, i) => `<div class="dia" data-f="${d.fecha}">${animoImg(d.animo)}<div class="d">${esc(d.dia).slice(0,3)} ${d.fecha.slice(8)}</div></div>`).join("")}</div>
      <div id="detalle"></div>
    </div>
    ${D.mensaje_docente ? `<div class="card cinta"><span class="rotulo">Mensaje de la escuela</span><p>${esc(D.mensaje_docente)}</p></div>` : ""}
    ${D.agenda ? `<div class="card"><span class="rotulo">Así va a ser su ${esc(D.agenda.dia || "próximo día")}</span><p class="muted">Contáselo la noche anterior mirando los pictos juntos. Los recuadros punteados son apoyos nuevos.</p>
      <div class="tira">${D.agenda.pasos.map(p => `<div class="picto ${p.es_apoyo ? "apoyo" : ""}" data-h="${esc(p.texto)}">${p.picto_url ? `<img src="${p.picto_url}" alt="">` : `<img data-k="${esc(p.palabra_clave)}" alt="">`}<div class="t">${esc(p.palabra_clave)}</div><div class="h">${esc(p.hora || "")}</div></div>`).join("")}</div></div>` : ""}
    ${D.objetivos?.length ? `<div class="card"><span class="rotulo">En qué estamos trabajando</span>${D.objetivos.map(o => { const [c, txt] = PLANO[o.estado] || ["", o.estado]; return `<div class="obj"><div style="flex:1"><b>${esc(o.objetivo)}</b></div><span class="sello ${c}">${txt}</span></div>`; }).join("")}</div>` : ""}
    ${logros.length ? `<div class="card"><span class="rotulo">Logros recientes</span>${logros.slice(0, 6).map(x => `<div class="logro">${esc(x.l)} <span class="muted">· ${esc(fechaLinda(x.f))}</span></div>`).join("")}</div>` : ""}
    <div class="card"><span class="rotulo">Preguntale a Puente</span>
      <p class="muted">Responde con lo que la escuela registró de ${esc(D.alumno)}. Para temas de salud, hablá con la docente.</p>
      <div class="chat" id="chat"></div>
      <div class="sug" id="sug">${["¿Cómo estuvo esta semana?", "¿Cómo viene comiendo?", "¿Qué día le cuesta más?", "¿Qué puedo hacer en casa?"].map(s => `<button>${s}</button>`).join("")}</div>
      <form id="f"><input id="q" placeholder="Escribí tu pregunta…" autocomplete="off"><button class="big">Enviar</button></form>
    </div>`;
  document.querySelectorAll(".dia").forEach(el => el.onclick = () => verDia(el.dataset.f));
  document.querySelectorAll(".picto[data-h]").forEach(el => el.onclick = () => hablar(el.dataset.h));
  document.querySelectorAll("#sug button").forEach(b => b.onclick = () => enviar(b.textContent));
  $("f").onsubmit = e => { e.preventDefault(); const v = $("q").value.trim(); if (v) { $("q").value = ""; enviar(v); } };
  if (dias[0]) verDia(dias[0].fecha);
  const s = $("semana"); s.scrollLeft = s.scrollWidth;
}

function verDia(f) {
  const d = D.dias.find(x => x.fecha === f); if (!d) return;
  document.querySelectorAll(".dia").forEach(el => el.classList.toggle("on", el.dataset.f === f));
  $("detalle").innerHTML = `<p style="margin:12px 0 4px"><b style="text-transform:capitalize">${esc(fechaLinda(f))}</b> · ${esc(d.animo || "")}</p>
    ${d.resumen ? `<p>${esc(d.resumen)}</p>` : ""}
    ${d.logros.map(l => `<div class="logro">${esc(l)}</div>`).join("")}
    ${d.alertas.map(a => `<div class="alerta">${esc(a)}</div>`).join("")}
    <div class="tira">${d.actividades.map(a => `<div class="picto ${a.estado || ""}" data-h="${esc(a.actividad)}">${a.picto_url ? `<img src="${a.picto_url}" alt="">` : `<img data-k="${esc(a.palabra_clave)}" alt="">`}<div class="t">${esc(a.palabra_clave)}</div><div class="h">${esc(a.hora || "")}</div></div>`).join("")}</div>`;
  $("detalle").querySelectorAll(".picto").forEach(el => el.onclick = () => hablar(el.dataset.h));
}

function burbuja(rol, texto) { const el = document.createElement("div"); el.className = "m " + rol; el.textContent = texto; $("chat").appendChild(el); $("chat").scrollTop = 1e6; return el; }
async function enviar(p) {
  $("sug").style.display = "none";
  burbuja("familia", p);
  const espera = burbuja("puente", "Puente está mirando los registros…");
  try {
    const r = await fetch("api/familia", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ accion:"preguntar", token:t, pregunta:p, historial:chat }) });
    const j = await r.json();
    espera.textContent = j.respuesta || j.error || "No pude responder.";
    chat.push({ rol:"familia", texto:p }, { rol:"puente", texto:espera.textContent });
  } catch { espera.textContent = "No pude conectarme. Probá de nuevo."; }
}
cargar();
</script>
</body>
</html>
